<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .game {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      transition: 0.2s;
    }

    .game:hover {
      transform: scale(1.05);
      background: #333;
    }

    a {
      color: #00ffcc;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<iframe src="" scrolling="no" style="width: 700px; height: 900px; border: 0; margin: 0; padding: 0;"> </iframe>

</html>
