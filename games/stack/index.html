<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Arcade</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .game {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      transition: 0.2s;
    }

    .game:hover {
      transform: scale(1.05);
      background: #333;
    }

    a {
      color: #00ffcc;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎮 Mi Arcade</h1>
  <p>Selecciona un juego:</p>

  <div class="game-list">
    <div class="game">
      <a href="games/stack/index.html">Stack</a>
    </div>

    <div class="game">
      <a href="games/tetris/index.html">Tetris</a>
    </div>

    <div class="game">
      <a href="games/otro-juego/index.html">Otro juego</a>
    </div>
  </div>

</body>
</html>
