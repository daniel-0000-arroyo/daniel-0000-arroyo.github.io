<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Arcade</title>

  <style>
    /* Estilos generales */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      color: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 3rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #00ffcc;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    /* Contenedor de juegos */
    .game-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 40px 20px;
    }

    /* Tarjeta de juego */
    .game {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      width: 220px;
      transition: transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
    }

    .game:hover {
      transform: translateY(-6px) scale(1.05);
      background: #262626;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    /* Enlaces */
    a {
      color: #00ffcc;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      display: block;
      padding: 10px 0;
    }

    a:hover {
      text-shadow: 0 0 8px #00ffcc;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
